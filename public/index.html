<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>xs0Movie</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
  :root{
    --bg:#0a0a0d;
    --bg2:#111116;
    --fg:#f5f5f7;
    --muted:#8a8a95;
    --line:rgba(255,255,255,.08);
    --line2:rgba(255,255,255,.14);
    --amber:#ffb300;
    --pink:#ff2d78;
    --cyan:#38e1ff;
    --purple:#8b5cf6;
    --r:14px;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
  body{min-height:100dvh;letter-spacing:-.01em;line-height:1.45}
  ::selection{background:var(--amber);color:#000}
  img{display:block;max-width:100%}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input{font:inherit;color:inherit;background:none;border:none;outline:none}
  a{color:inherit;text-decoration:none}

  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.035;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    mix-blend-mode:overlay;
  }

  header{
    position:fixed;top:0;left:0;right:0;z-index:60;
    display:flex;align-items:center;gap:14px;
    padding:14px max(18px,env(safe-area-inset-left)) 14px max(18px,env(safe-area-inset-right));
    background:linear-gradient(180deg,rgba(10,10,13,.92),rgba(10,10,13,0));
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    transition:background .3s var(--ease),padding .3s var(--ease);
  }
  header.solid{background:rgba(10,10,13,.85);border-bottom:1px solid var(--line)}
  .logo{font-weight:900;font-size:22px;letter-spacing:-.045em;display:flex;align-items:center;gap:2px;white-space:nowrap}
  .logo b{background:linear-gradient(92deg,var(--amber),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo span{color:var(--fg);opacity:.9}
  .search-wrap{flex:1;max-width:460px;position:relative;margin-left:auto}
  .search-wrap input{
    width:100%;padding:11px 16px 11px 42px;border-radius:999px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    font-size:14px;transition:all .25s var(--ease);
  }
  .search-wrap input:focus{background:rgba(255,255,255,.08);border-color:var(--line2);box-shadow:0 0 0 3px rgba(255,179,0,.1)}
  .search-wrap svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.5}
  .clock{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap;display:none}
  @media(min-width:720px){.clock{display:block}}

  .hero{
    position:relative;min-height:100dvh;display:flex;align-items:center;
    padding:120px max(20px,5vw) 60px;
    overflow:hidden;isolation:isolate;
  }
  #orb{position:absolute;right:-8%;top:50%;transform:translateY(-50%);width:min(60vw,720px);height:min(60vw,720px);z-index:-1;opacity:.9;pointer-events:none}
  @media(max-width:820px){#orb{right:-30%;top:20%;transform:none;width:110vw;height:110vw;opacity:.35}}
  .hero-inner{max-width:1280px;margin:0 auto;width:100%}
  .hero-kicker{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:20px}
  .hero-kicker::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent,var(--amber));box-shadow:0 0 12px var(--accent,var(--amber));animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .hero h1{font-size:clamp(38px,8vw,88px);font-weight:900;letter-spacing:-.045em;line-height:.95;margin-bottom:16px;max-width:14ch}
  .hero h1 em{font-style:normal;background:linear-gradient(92deg,var(--accent,var(--amber)),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{font-size:clamp(15px,2vw,18px);color:var(--muted);max-width:46ch;margin-bottom:32px}
  .hero-actions{display:flex;gap:12px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:9px;padding:14px 26px;border-radius:999px;font-weight:600;font-size:15px;transition:all .25s var(--ease)}
  .btn-primary{background:var(--fg);color:#000}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(255,255,255,.15)}
  .btn-ghost{border:1px solid var(--line2);color:var(--fg)}
  .btn-ghost:hover{background:rgba(255,255,255,.06);border-color:var(--line2)}

  main{padding:0 max(18px,4vw) 100px;max-width:1480px;margin:0 auto;position:relative;z-index:2}
  .row{margin-bottom:44px}
  .row-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
  .row-head h2{font-size:clamp(17px,2.4vw,22px);font-weight:700;letter-spacing:-.02em}
  .row-head span{font-size:12px;color:var(--muted)}
  .rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(140px,180px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
  @media(min-width:720px){.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}}

  .card{position:relative;border-radius:var(--r);overflow:hidden;background:var(--bg2);cursor:pointer;scroll-snap-align:start;transition:transform .35s var(--ease),box-shadow .35s var(--ease);aspect-ratio:2/3}
  .card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 20px 40px rgba(0,0,0,.6),0 0 0 1px var(--line2)}
  .card img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease),opacity .4s}
  .card:hover img{transform:scale(1.06)}
  .card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.9));pointer-events:none}
  .card-meta{position:absolute;left:10px;right:10px;bottom:10px;z-index:2}
  .card-meta h3{font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card-meta small{font-size:11px;color:var(--muted);display:block;margin-top:3px}
  .card-badge{position:absolute;top:10px;left:10px;z-index:2;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);border:1px solid var(--line)}

  .empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}
  .empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:6px}

  .skel{background:linear-gradient(90deg,#15151b 25%,#1e1e26 50%,#15151b 75%);background-size:200% 100%;animation:sh 1.4s infinite;border-radius:var(--r);aspect-ratio:2/3}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

  .overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
  .overlay.open{opacity:1;pointer-events:auto}
  .sheet{width:min(920px,100%);max-height:92dvh;overflow-y:auto;border-radius:20px;background:var(--bg2);border:1px solid var(--line2);transform:translateY(20px) scale(.98);transition:transform .4s var(--ease);scrollbar-width:thin}
  .overlay.open .sheet{transform:none}
  .sheet-banner{position:relative;height:220px;overflow:hidden}
  .sheet-banner img{width:100%;height:100%;object-fit:cover;filter:blur(2px) brightness(.55);transform:scale(1.1)}
  .sheet-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,var(--bg2))}
  .sheet-body{padding:0 24px 24px;margin-top:-100px;position:relative;z-index:2}
  .sheet-title{font-size:clamp(22px,4vw,34px);font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
  .sheet-sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .sheet-desc{font-size:14px;line-height:1.65;color:#c8c8d0;margin-bottom:22px;max-width:65ch}
  .eps-head{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:12px}
  .eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .ep{padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);text-align:left;transition:all .2s var(--ease);font-size:13px}
  .ep:hover{background:rgba(255,179,0,.12);border-color:var(--amber);transform:translateY(-2px)}
  .ep b{display:block;font-weight:700;font-size:14px;margin-bottom:2px}
  .ep small{color:var(--muted);font-size:11px}
  .close-btn{position:absolute;top:14px;right:14px;z-index:5;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);display:grid;place-items:center;border:1px solid var(--line2);transition:all .2s}
  .close-btn:hover{background:rgba(255,255,255,.15);transform:rotate(90deg)}

  .player{position:fixed;inset:0;z-index:200;background:#000;display:none;flex-direction:column}
  .player.open{display:flex}
  .player video{width:100%;height:100%;object-fit:contain;background:#000}
  .player-bar{position:absolute;top:0;left:0;right:0;padding:16px 20px;display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);z-index:5;opacity:1;transition:opacity .3s}
  .player.hide-bar .player-bar{opacity:0;pointer-events:none}
  .player-title{font-size:14px;font-weight:600;flex:1}
  .player-nav{display:flex;gap:8px}
  .player-nav button{padding:8px 14px;border-radius:8px;background:rgba(255,255,255,.1);font-size:12px;transition:background .2s}
  .player-nav button:hover{background:rgba(255,255,255,.2)}
  .player-nav button:disabled{opacity:.3;cursor:not-allowed}
  .spinner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--amber);border-radius:50%;animation:spin .8s linear infinite;display:none;z-index:3}
  .spinner.on{display:block}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

  .cfg{width:min(440px,100%);padding:32px;border-radius:20px;background:var(--bg2);border:1px solid var(--line2)}
  .cfg h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
  .cfg p{color:var(--muted);font-size:13px;margin-bottom:20px;line-height:1.6}
  .cfg input{width:100%;padding:14px 16px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line2);font-size:14px;font-family:ui-monospace,monospace;margin-bottom:14px}
  .cfg input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,179,0,.12)}
  .cfg .btn-primary{width:100%;justify-content:center}

  .toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,100px);z-index:300;padding:12px 22px;border-radius:999px;background:var(--bg2);border:1px solid var(--line2);font-size:13px;box-shadow:0 10px 40px rgba(0,0,0,.6);transition:transform .4s var(--ease);pointer-events:none}
  .toast.show{transform:translate(-50%,0)}

  .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
  .reveal.in{opacity:1;transform:none}

  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<header id="hdr">
  <div class="logo"><span>xs0</span><b>Movie</b></div>
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="search" type="search" placeholder="Cari film, drama, anime…" autocomplete="off" spellcheck="false">
  </div>
  <div class="clock" id="clock">--:--</div>
</header>

<section class="hero">
  <canvas id="orb"></canvas>
  <div class="hero-inner">
    <div class="hero-kicker" id="kicker">memuat</div>
    <h1 id="greet">Selamat <em>malam</em>.</h1>
    <p id="subgreet">Mau nonton apa sekarang?</p>
    <div class="hero-actions">
      <button class="btn btn-primary" onclick="document.getElementById('search').focus()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        Cari sekarang
      </button>
      <button class="btn btn-ghost" onclick="scrollToRow('trending')">Lihat trending</button>
    </div>
  </div>
</section>

<main>
  <section class="row" id="row-history" style="display:none">
    <div class="row-head"><h2>Lanjut Nonton</h2><span id="history-count"></span></div>
    <div class="rail" id="history-rail"></div>
  </section>

  <section class="row" id="row-results" style="display:none">
    <div class="row-head"><h2 id="results-title">Hasil</h2><span id="results-count"></span></div>
    <div class="grid" id="results-grid"></div>
  </section>

  <section class="row" id="row-trending">
    <div class="row-head"><h2>Trending Hari Ini</h2><span>realtime dari Viu</span></div>
    <div class="grid" id="trending-grid"></div>
  </section>
</main>

<div class="overlay" id="detail">
  <div class="sheet" role="dialog" aria-modal="true">
    <button class="close-btn" onclick="closeDetail()" aria-label="Tutup">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="sheet-banner"><img id="d-banner" alt=""></div>
    <div class="sheet-body">
      <h2 class="sheet-title" id="d-title">—</h2>
      <div class="sheet-sub" id="d-sub">—</div>
      <p class="sheet-desc" id="d-desc">—</p>
      <div class="eps-head">Episode</div>
      <div class="eps" id="d-eps"></div>
    </div>
  </div>
</div>

<div class="player" id="player">
  <div class="spinner" id="spinner"></div>
  <div class="player-bar">
    <button onclick="closePlayer()" aria-label="Tutup" style="width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="player-title" id="p-title">—</div>
    <div class="player-nav">
      <button id="p-prev" onclick="prevEp()">‹ Prev</button>
      <button id="p-next" onclick="nextEp()">Next ›</button>
    </div>
  </div>
  <video id="video" controls playsinline crossorigin="anonymous"></video>
</div>

<div class="overlay" id="cfg-overlay">
  <div class="cfg">
    <h2>Masuk dulu</h2>
    <p>Tempel API Key xs0Movie lo di sini. Kunci disimpen di perangkat ini doang.</p>
    <input id="cfg-key" type="password" placeholder="X-API-Key…" autocomplete="off">
    <button class="btn btn-primary" onclick="saveKey()">Simpan & Lanjut</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = ""; // Kosongin karena satu domain sama API
let API_KEY = localStorage.getItem("xs0.key") || "";

async function api(path){
  const r = await fetch(API_BASE + path, {
    headers: { "X-API-Key": API_KEY, "accept": "application/json" }
  });
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove("show"), 2400);
}

const GREETINGS = {
  pagi:   { label:"pagi",   word:"pagi",   accent:"#ffb300", sub:"Kopi dulu, baru lanjut maraton.", tag:"Selamat pagi" },
  siang:  { label:"siang",  word:"siang",  accent:"#38e1ff", sub:"Jam istirahat. Waktunya satu episode.", tag:"Selamat siang" },
  sore:   { label:"sore",   word:"sore",   accent:"#ff7a45", sub:"Matahari turun, tirai ditutup, layar nyala.", tag:"Selamat sore" },
  malam:  { label:"malam",  word:"malam",  accent:"#8b5cf6", sub:"Lampu mati. Layar jadi satu-satunya cahaya.", tag:"Selamat malam" }
};

function getWibHour(){
  const now = new Date();
  const utc = now.getTime() + now.getTimezoneOffset() * 60000;
  return new Date(utc + 7 * 3600000).getHours();
}
function greetingFor(h){
  if(h>=4 && h<11) return GREETINGS.pagi;
  if(h>=11 && h<15) return GREETINGS.siang;
  if(h>=15 && h<18) return GREETINGS.sore;
  return GREETINGS.malam;
}
function updateGreeting(){
  const h = getWibHour();
  const g = greetingFor(h);
  document.documentElement.style.setProperty("--accent", g.accent);
  document.getElementById("kicker").textContent = g.tag;
  document.getElementById("greet").innerHTML = `Selamat <em>${g.word}</em>.`;
  document.getElementById("subgreet").textContent = g.sub;
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString("id-ID",{timeZone:"Asia/Jakarta",hour:"2-digit",minute:"2-digit"});
  orbTheme = g.accent;
}
setInterval(updateGreeting, 30000);
updateGreeting();

let orbTheme = "#8b5cf6";
const cvs = document.getElementById("orb");
const ctx = cvs.getContext("2d");
let W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
let orbPaused = false;

function resizeOrb(){
  const rect = cvs.getBoundingClientRect();
  W = rect.width; H = rect.height;
  cvs.width = W*DPR; cvs.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize", resizeOrb);
resizeOrb();

const N = 180;
const pts = [];
for(let i=0;i<N;i++){
  const phi = Math.acos(1 - 2*(i+0.5)/N);
  const theta = Math.PI*(1+Math.sqrt(5))*i;
  pts.push({
    x: Math.cos(theta)*Math.sin(phi),
    y: Math.sin(theta)*Math.sin(phi),
    z: Math.cos(phi)
  });
}
const EDGES = [];
for(let i=0;i<N;i++){
  for(let j=i+1;j<N;j++){
    const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, dz=pts[i].z-pts[j].z;
    const d2 = dx*dx+dy*dy+dz*dz;
    if(d2 < 0.075) EDGES.push([i,j]);
  }
}

let t0 = performance.now();
function drawOrb(now){
  if(orbPaused) return;
  const t = (now - t0) / 1000;
  const rect = cvs.getBoundingClientRect();
  if(rect.bottom < 0 || rect.top > innerHeight){ requestAnimationFrame(drawOrb); return; }
  ctx.clearRect(0,0,W,H);

  const cx = W/2, cy = H/2, R = Math.min(W,H)*0.36;
  const rotY = t * 0.35, rotX = Math.sin(t*0.22)*0.35;
  const cosY=Math.cos(rotY), sinY=Math.sin(rotY);
  const cosX=Math.cos(rotX), sinX=Math.sin(rotX);
  const proj = pts.map(p=>{
    let x = p.x*cosY - p.z*sinY;
    let z = p.x*sinY + p.z*cosY;
    let y = p.y*cosX - z*sinX;
    z = p.y*sinX + z*cosX;
    const persp = 1.9 / (1.9 + z*0.9);
    return { x: cx + x*R*persp, y: cy + y*R*persp, z, persp };
  });

  ctx.lineWidth = 0.7;
  ctx.strokeStyle = orbTheme;
  for(const [i,j] of EDGES){
    const a = proj[i], b = proj[j];
    const depth = (a.z + b.z) * 0.5;
    ctx.globalAlpha = Math.max(0, 0.09 - depth*0.09);
    ctx.beginPath();
    ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
    ctx.stroke();
  }
  for(const p of proj){
    const size = Math.max(0.6, 2.6 * p.persp);
    ctx.globalAlpha = Math.max(0.08, 0.85 - p.z*0.35);
    ctx.fillStyle = orbTheme;
    ctx.beginPath(); ctx.arc(p.x,p.y,size,0,6.283); ctx.fill();
  }
  const grd = ctx.createRadialGradient(cx,cy,0,cx,cy,R*1.5);
  grd.addColorStop(0, orbTheme + "22");
  grd.addColorStop(1, "transparent");
  ctx.globalAlpha = 1;
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(cx,cy,R*1.5,0,6.283); ctx.fill();

  requestAnimationFrame(drawOrb);
}
requestAnimationFrame(drawOrb);
document.addEventListener("visibilitychange", ()=>{ orbPaused = document.hidden; });

function placeholder(seed){
  const h = [...String(seed)].reduce((a,c)=>a+c.charCodeAt(0),0)%360;
  return `linear-gradient(135deg,hsl(${h} 60% 22%),hsl(${(h+40)%360} 70% 12%))`;
}

async function loadTrending(){
  const grid = document.getElementById("trending-grid");
  grid.innerHTML = Array(8).fill('<div class="skel"></div>').join("");
  try{
    const data = await api("/api/home");
    const list = data.data || data.recommendations || [];
    if(!list.length) throw new Error("kosong");
    grid.innerHTML = "";
    list.slice(0,12).forEach((s,i)=>{
      const id = s.series_id || s.id;
      grid.appendChild(makeCard({ id, title: `Series ${id}`, index:i }));
    });
  }catch(e){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><b>Belum bisa ambil trending</b>${e.message}. Coba cari manual pake kotak di atas.</div>`;
  }
}

function makeCard({ id, title, sub, index=0, poster }){
  const el = document.createElement("div");
  el.className = "card reveal";
  el.style.transitionDelay = (index * 30) + "ms";
  el.innerHTML = `
    ${poster ? `<img loading="lazy" src="${poster}" alt="" onerror="this.style.display='none'">` : `<div style="position:absolute;inset:0;background:${placeholder(id)}"></div>`}
    <div class="card-badge">#${index+1}</div>
    <div class="card-meta">
      <h3>${escapeHtml(title || "Tanpa judul")}</h3>
      ${sub?`<small>${escapeHtml(sub)}</small>`:""}
    </div>`;
  el.onclick = ()=>openDetail(id, title);
  return el;
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

let searchT;
const searchInput = document.getElementById("search");
searchInput.addEventListener("input", ()=>{
  clearTimeout(searchT);
  const q = searchInput.value.trim();
  if(!q){ document.getElementById("row-results").style.display = "none"; return; }
  searchT = setTimeout(()=>runSearch(q), 450);
});

async function runSearch(q){
  const row = document.getElementById("row-results");
  const grid = document.getElementById("results-grid");
  const title = document.getElementById("results-title");
  const count = document.getElementById("results-count");
  row.style.display = "block";
  title.textContent = `Hasil: "${q}"`;
  count.textContent = "";
  grid.innerHTML = Array(6).fill('<div class="skel"></div>').join("");
  try{
    const data = await api("/api/search?q=" + encodeURIComponent(q));
    const series = data.series || [];
    const actors = data.actor || [];
    count.textContent = `${series.length} judul`;
    grid.innerHTML = "";
    if(!series.length && !actors.length){
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><b>Nggak ketemu</b>Coba kata kunci lain.</div>`;
      return;
    }
    series.forEach((s,i)=>{
      grid.appendChild(makeCard({ id:s.id, title:s.name, sub: s.weight ? `skor ${s.weight}` : "", index:i }));
    });
    if(actors.length){
      actors.forEach((a,i)=>{
        const el = document.createElement("div");
        el.className = "card reveal";
        el.style.transitionDelay = (i*30)+"ms";
        el.innerHTML = `<div style="position:absolute;inset:0;background:${placeholder(a.name)}"></div>
          <div class="card-badge">Aktor</div>
          <div class="card-meta"><h3>${escapeHtml(a.name)}</h3></div>`;
        grid.appendChild(el);
      });
    }
  }catch(e){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><b>Pencarian gagal</b>${escapeHtml(e.message)}</div>`;
  }
}

let currentSeries = null;

async function openDetail(id, fallbackTitle){
  const overlay = document.getElementById("detail");
  document.getElementById("d-title").textContent = fallbackTitle || `Series ${id}`;
  document.getElementById("d-sub").textContent = "memuat…";
  document.getElementById("d-desc").textContent = "";
  document.getElementById("d-eps").innerHTML = "";
  document.getElementById("d-banner").style.background = placeholder(id);
  document.getElementById("d-banner").removeAttribute("src");
  overlay.classList.add("open");

  try{
    const data = await api("/api/series/" + id);
    const eps = data.episodes || [];
    currentSeries = { id, title: fallbackTitle, episodes: eps };

    const first = eps[0] || {};
    const title = (first.synopsis || fallbackTitle || `Series ${id}`).replace(/\s*-\s*Episode\s*\d+.*$/i,"").trim();
    document.getElementById("d-title").textContent = title;
    document.getElementById("d-sub").textContent =
      [first.series_category_name, `${eps.length} episode`].filter(Boolean).join(" · ");
    document.getElementById("d-desc").textContent = first.description || first.synopsis || "Sinopsis belum tersedia.";
    if(first.cover_landscape_image_url){
      const img = document.getElementById("d-banner");
      img.src = first.cover_landscape_image_url;
      img.style.background = "none";
    }

    const box = document.getElementById("d-eps");
    box.innerHTML = "";
    if(!eps.length){
      box.innerHTML = `<div class="empty" style="grid-column:1/-1">Belum ada episode.</div>`;
      return;
    }
    eps.forEach(ep=>{
      const b = document.createElement("button");
      b.className = "ep";
      const dur = ep.time_duration ? Math.round(parseInt(ep.time_duration)/60) + " mnt" : "";
      b.innerHTML = `<b>EP ${ep.number}</b><small>${dur}</small>`;
      b.onclick = ()=>playEpisode(ep, { id, title });
      box.appendChild(b);
    });
  }catch(e){
    document.getElementById("d-sub").textContent = "gagal memuat";
    document.getElementById("d-desc").textContent = e.message;
  }
}
function closeDetail(){ document.getElementById("detail").classList.remove("open"); }

const player = document.getElementById("player");
const video = document.getElementById("video");
let hls = null;
let activeEp = null, activeSeries = null;

function findUrl(obj){
  if(!obj) return null;
  if(typeof obj === "string") return /^https?:\/\//.test(obj) && /\.(m3u8|mp4)/i.test(obj) ? obj : null;
  if(Array.isArray(obj)){ for(const v of obj){ const u = findUrl(v); if(u) return u; } return null; }
  if(typeof obj === "object"){
    const keys = ["play_url","hls_url","stream_url","url","link","video_url","m3u8","mp4_url","src"];
    for(const k of keys){ if(typeof obj[k] === "string" && /^https?:\/\//.test(obj[k])) return obj[k]; }
    for(const k in obj){ const u = findUrl(obj[k]); if(u) return u; }
  }
  return null;
}

async function playEpisode(ep, series){
  activeEp = ep; activeSeries = series;
  player.classList.add("open");
  document.getElementById("spinner").classList.add("on");
  document.getElementById("p-title").textContent = `${series.title || ""} · EP ${ep.number}`;
  document.getElementById("d-title").textContent = series.title || "";

  const eps = currentSeries?.episodes || [];
  const idx = eps.findIndex(e=>String(e.product_id)===String(ep.product_id));
  document.getElementById("p-prev").disabled = idx <= 0;
  document.getElementById("p-next").disabled = idx < 0 || idx >= eps.length - 1;

  try{
    const data = await api(`/api/play/${ep.product_id}?series_id=${series.id}`);
    const url = findUrl(data);
    if(!url) throw new Error("URL stream nggak ketemu di response");
    attachStream(url);
    saveHistory(series.id, ep, series.title);
  }catch(e){
    document.getElementById("spinner").classList.remove("on");
    toast("Gagal buka stream: " + e.message);
  }
}

function attachStream(url){
  if(hls){ hls.destroy(); hls = null; }
  if(url.endsWith(".m3u8")){
    if(window.Hls && Hls.isSupported()){
      hls = new Hls({ enableWorker:true, lowLatencyMode:true, backBufferLength:60 });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, ()=>{
        document.getElementById("spinner").classList.remove("on");
        video.play().catch(()=>{});
      });
      hls.on(Hls.Events.ERROR, (_, d)=>{
        if(d.fatal){ toast("Stream error: " + d.type); document.getElementById("spinner").classList.remove("on"); }
      });
    } else {
      video.src = url; video.play().catch(()=>{});
    }
  } else {
    video.src = url;
    video.play().catch(()=>{});
    document.getElementById("spinner").classList.remove("on");
  }
}

function nextEp(){
  const eps = currentSeries?.episodes || [];
  const i = eps.findIndex(e=>String(e.product_id)===String(activeEp?.product_id));
  if(i>=0 && i<eps.length-1) playEpisode(eps[i+1], activeSeries);
}
function prevEp(){
  const eps = currentSeries?.episodes || [];
  const i = eps.findIndex(e=>String(e.product_id)===String(activeEp?.product_id));
  if(i>0) playEpisode(eps[i-1], activeSeries);
}
function closePlayer(){
  player.classList.remove("open");
  if(hls){ hls.destroy(); hls = null; }
  video.pause(); video.removeAttribute("src"); video.load();
}

document.addEventListener("keydown", e=>{
  if(e.key === "Escape"){ closePlayer(); closeDetail(); }
  if(e.key === "/" && document.activeElement !== searchInput){ e.preventDefault(); searchInput.focus(); }
  if(player.classList.contains("open")){
    if(e.key === "ArrowRight") nextEp();
    if(e.key === "ArrowLeft") prevEp();
  }
});

function saveHistory(seriesId, ep, title){
  const h = JSON.parse(localStorage.getItem("xs0.history") || "[]");
  const filtered = h.filter(x=>x.seriesId !== seriesId);
  filtered.unshift({ seriesId, ep: ep.number, productId: ep.product_id, title, ts: Date.now() });
  localStorage.setItem("xs0.history", JSON.stringify(filtered.slice(0,12)));
  renderHistory();
}
function renderHistory(){
  const h = JSON.parse(localStorage.getItem("xs0.history") || "[]");
  const row = document.getElementById("row-history");
  const rail = document.getElementById("history-rail");
  if(!h.length){ row.style.display = "none"; return; }
  row.style.display = "block";
  document.getElementById("history-count").textContent = `${h.length} judul`;
  rail.innerHTML = "";
  h.forEach((item,i)=>{
    const card = makeCard({ id: item.seriesId, title: item.title || `Series ${item.seriesId}`, sub:`EP ${item.ep}`, index:i });
    rail.appendChild(card);
  });
}

function saveKey(){
  const v = document.getElementById("cfg-key").value.trim();
  if(!v){ toast("Key kosong"); return; }
  API_KEY = v;
  localStorage.setItem("xs0.key", v);
  document.getElementById("cfg-overlay").classList.remove("open");
  init();
}
if(!API_KEY){ document.getElementById("cfg-overlay").classList.add("open"); }

const io = new IntersectionObserver(entries=>{
  entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } });
}, { threshold:.08 });
function observeReveals(){ document.querySelectorAll(".reveal:not(.in)").forEach(el=>io.observe(el)); }

function scrollToRow(id){
  const el = document.getElementById("row-" + id);
  if(el) el.scrollIntoView({ behavior:"smooth", block:"start" });
}

window.addEventListener("scroll", ()=>{
  document.getElementById("hdr").classList.toggle("solid", scrollY > 40);
}, { passive:true });

async function init(){
  if(!API_KEY) return;
  renderHistory();
  await loadTrending();
  observeReveals();
}
init();
</script>
